<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario a WhatsApp y Google Sheets</title>
    <style>
        /* Estilos básicos para que el formulario se vea ordenado */
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        form { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #25D366; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #128C7E; }
    </style>
</head>
<body>

    <h2>Formulario de Contacto</h2>

    <form id="miFormulario">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required placeholder="Ej: 54911xxxxxxx">

        <label for="mensaje">Mensaje / Pedido:</label>
        <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Escribe tu mensaje aquí..."></textarea>

        <button type="submit">Enviar a WhatsApp y Guardar</button>
    </form>

    <script>
        // Configuración de rutas y credenciales
        const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycby5VtfxSCKbgUZorIGgUHQxLH7NbALc9cAXrBYmJlAouONTowOy9KEWCndB7jC93uvTmA/exec";
        const NUMERO_WHATSAPP = "54911XXXXXXXX"; // Reemplaza con tu número (código de país + área + número sin el signo +)

        document.getElementById('miFormulario').addEventListener('submit', function(e) {
            e.preventDefault(); // Detiene el envío por defecto para controlar el flujo con JS

            // 1. Obtener los valores ingresados por el usuario
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const mensaje = document.getElementById('mensaje').value;

            // 2. Preparar los datos en el formato que espera el comando 'doPost' de tu Apps Script
            const formData = new FormData();
            formData.append('nombre', nombre);
            formData.append('telefono', telefono);
            formData.append('mensaje', mensaje);

            // Cambiar temporalmente el texto del botón para feedback del usuario
            const boton = e.target.querySelector('button');
            const textoOriginal = boton.innerText;
            boton.innerText = "Procesando...";
            boton.disabled = true;

            // 3. Enviar los datos a la hoja de cálculo en segundo plano
            fetch(URL_GOOGLE_SHEETS, {
                method: 'POST',
                body: formData,
                mode: 'no-cors' // Evita restricciones de CORS con Google
            })
            .then(() => {
                console.log('Datos guardados en Google Sheets.');

                // 4. Construir el mensaje personalizado para WhatsApp
                const textoWhatsapp = `*Nuevo Mensaje desde la Web*\n\n*Nombre:* ${nombre}\n*Teléfono:* ${telefono}\n*Mensaje:* ${mensaje}`;
                
                // Generar URL para WhatsApp Web / App
                const urlWhatsapp = `https://api.whatsapp.com/send?phone=${NUMERO_WHATSAPP}&text=${encodeURIComponent(textoWhatsapp)}`;
                
                // Redirigir al usuario a WhatsApp (abre una nueva pestaña)
                window.open(urlWhatsapp, '_blank');
            })
            .catch(error => {
                console.error('Error al enviar los datos:', error);
                alert('Hubo un inconveniente al procesar tu solicitud. Por favor, intenta nuevamente.');
            })
            .finally(() => {
                // Restaurar el estado del botón
                boton.innerText = textoOriginal;
                boton.disabled = false;
            });
        });
    </script>

</body>
</html>
